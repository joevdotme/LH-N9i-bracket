[project]
name = "bracketlab"
version = "0.1.0"
description = "Parametric NH-L9i fastening bars for nonstandard motherboard hole patterns."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "build123d>=0.8",
    "ezdxf>=1.3",
    "PyYAML>=6",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bracketlab = "bracketlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
