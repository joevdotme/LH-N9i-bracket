name: brackets

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: make test
      - name: Build stock and Gen8 bars
        run: make brackets
      - uses: actions/upload-artifact@v4
        with:
          name: brackets
          path: build/
          if-no-files-found: error
